<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina niet gevonden | Arqi</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ff-disp:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --ff-body:'DM Sans',system-ui,sans-serif;
  --ff-mono:'JetBrains Mono',monospace;
  --mag:#5C6E7A;--ink:#0F0E0C;--mid:#4A4840;--sub:#9B9790;--rule:#E8E6E1;--card:#F9F8F6;
}
body{font-family:var(--ff-body);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:#fff;z-index:100}
.nav img{height:32px;width:auto}
.nav-back{font-size:13px;color:#0F0E0C!important;font-weight:600;text-decoration:none;opacity:.85;}
.nav-back:hover{color:var(--ink)}
.hero{padding:36px 24px 28px;border-bottom:1px solid var(--rule)}
.eyebrow{
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#5C6E7A;display:block;margin-bottom:10px;
}
.hero h1{font-family:var(--ff-disp);font-size:clamp(28px,8vw,42px);font-weight:900;letter-spacing:-1.5px;line-height:1.05;color:var(--ink);margin-bottom:12px}
.defn{font-size:15px;color:var(--mid);line-height:1.65;border-left:3px solid var(--mag);padding-left:16px;margin-top:4px}
section{padding:28px 24px;border-bottom:1px solid var(--rule)}
section h2{font-family:var(--ff-disp);font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--ink);margin-bottom:10px}
section p{font-size:14px;color:var(--mid);line-height:1.72}
.example-box{background:var(--card);border-radius:12px;padding:18px 18px 16px;margin-top:4px}
.example-label{font-family:var(--ff-mono);font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);display:block;margin-bottom:8px}
.example-text{font-size:13px;color:var(--ink);line-height:1.65}




.footer{padding:16px 24px;text-align:center;font-size:11px;color:var(--sub)}
.footer a{color:var(--ink);font-weight:600;text-decoration:none}




@keyframes neon-pulse{0%,100%{border-color:rgba(92,110,122,.7);box-shadow:0 0 8px rgba(92,110,122,.2);}50%{border-color:rgba(92,110,122,1);box-shadow:0 0 16px rgba(92,110,122,.4);}}







/* ══ DARK MODE ══ */
:root[data-theme="dark"]{--ink:#E7ECEE;--mid:#A9B6BC;--subtle:#77868D;--sub:#77868D;
  --rule:#26333A;--card:#151D22;--bg:#0C1114;--white:#0C1114;}
:root[data-theme="dark"] body{background:#0C1114;color:#E7ECEE;}
:root[data-theme="dark"] .nav{background:#0C1114;border-color:#26333A;}
:root[data-theme="dark"] .nav-back{color:#E7ECEE!important;}
:root[data-theme="dark"] .nav-brand{color:#E7ECEE;}
:root[data-theme="dark"] .nav-brand span{background:#151D22!important;color:#E7ECEE!important;border-color:#33434B!important;}
:root[data-theme="dark"] .kb-hero,
:root[data-theme="dark"] .hero{background:#0C1114;border-color:#26333A;}
:root[data-theme="dark"] .kb-hero h1,
:root[data-theme="dark"] .hero h1,
:root[data-theme="dark"] .kb-term,
:root[data-theme="dark"] section h2,
:root[data-theme="dark"] .example-text,
:root[data-theme="dark"] .kb-nextprev strong{color:#E7ECEE;}
:root[data-theme="dark"] .kb-cat-label{background:#151D22;border-color:#26333A;color:#A9B6BC;}
:root[data-theme="dark"] .kb-row,
:root[data-theme="dark"] .kb-sub-row,
:root[data-theme="dark"] section{border-color:#26333A;}
:root[data-theme="dark"] .kb-row:hover,
:root[data-theme="dark"] .kb-sub-row:hover{background:rgba(92,110,122,.14);}
:root[data-theme="dark"] .kb-subs{background:rgba(38,51,58,.35);}
:root[data-theme="dark"] .example-box,
:root[data-theme="dark"] .kb-chip{background:#151D22;border-color:#26333A;color:#A9B6BC;}
:root[data-theme="dark"] .kb-nextprev a{border-color:#26333A;}
:root[data-theme="dark"] .page-footer,
:root[data-theme="dark"] .footer{background:#0C1114;border-color:#26333A;}
:root[data-theme="dark"] .page-footer a,
:root[data-theme="dark"] .footer a{color:#E7ECEE;}
:root[data-theme="dark"] .theme-toggle .ico-sun{display:block;}
:root[data-theme="dark"] .theme-toggle .ico-moon{display:none;}
.theme-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);
  border-radius:100px;padding:6px 12px;cursor:pointer;background:transparent;
  font-family:var(--ff-mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--sub,#9B9790);transition:border-color .2s,color .2s;}
.theme-toggle:hover{border-color:var(--mag);color:var(--mag);}
.theme-toggle svg{width:13px;height:13px;}
.theme-toggle .ico-sun{display:none;}
.theme-toggle .ico-moon{display:block;}
.theme-toggle-wrap{display:flex;justify-content:center;padding:0 24px 20px;}
</style>
</head>
<body>
<nav class="nav">
  <a href="/"><img src="https://fliimedia.github.io/Flii.nl/assets/img/d913cc3c069f.png" alt="Arqi"></a>
  <a href="/" class="nav-back">&larr; Naar home</a>
</nav>
<div class="hero">
  <span class="eyebrow">404</span>
  <h1>Deze pagina bestaat niet</h1>
  <p class="defn">De link klopt niet meer of de pagina is verplaatst. Probeer de kennisbank of ga terug naar de homepage.</p>
</div>
<section>
  <h2>Verder</h2>
  <p><a href="/" style="color:#5C6E7A;font-weight:600">Home</a> &middot; <a href="/kennisbank" style="color:#5C6E7A;font-weight:600">Kennisbank</a> &middot; <a href="mailto:hallo@arqi.nl" style="color:#5C6E7A;font-weight:600">hallo@arqi.nl</a></p>
</section>
<div class="theme-toggle-wrap"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Wissel tussen licht en donker"><svg class="ico-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12.2A7 7 0 017.8 4a7 7 0 108.2 8.2z"/></svg><svg class="ico-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4"/></svg><span class="tt-label">Donker</span></button></div>
<footer class="footer">
  <p><a href="/">Arqi</a> &middot; by Flii Media &middot; &copy; 2026</p>
</footer>
<script>
(function(){
  var root=document.documentElement;
  function apply(m){
    root.setAttribute('data-theme',m);
    var l=document.querySelector('#theme-toggle .tt-label');
    if(l) l.textContent = m==='dark' ? 'Licht' : 'Donker';
  }
  var stored=null; try{stored=localStorage.getItem('arqi-theme');}catch(e){}
  apply(stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  document.addEventListener('click',function(e){
    var b=e.target.closest && e.target.closest('#theme-toggle'); if(!b) return;
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    apply(n); try{localStorage.setItem('arqi-theme',n);}catch(err){}
  });
})();
</script>
</body>
</html>
